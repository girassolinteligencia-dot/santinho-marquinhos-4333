  <line x1="130" y1="218" x2="200" y2="218" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="232" x2="175" y2="232" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

