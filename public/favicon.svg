<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados Squircle PWA -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Borda dourada suave interna -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#facc15" stroke-width="5" stroke-opacity="0.35"/>
  <rect x="22" y="22" width="468" height="468" rx="96" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Topo: VEM COM A GENTE -->
  <g transform="translate(256, 95)" text-anchor="middle">
    <!-- Mini Pill -->
    <rect x="-140" y="-34" width="280" height="46" rx="23" fill="#000000" fill-opacity="0.35" stroke="#4ade80" stroke-width="2"/>
    <text y="-5" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#4ade80" letter-spacing="3.5">
      VEM COM A GENTE
    </text>
  </g>

  <!-- Nome: MARQUINHOS -->
  <!-- Letras brancas com sombra marcante -->
  <text x="256" y="215" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="56" font-weight="950" fill="#ffffff" letter-spacing="2" filter="url(#badgeShadow)">
    MARQUINHOS
  </text>
  <text x="256" y="262" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#86efac" letter-spacing="5">
    TRAD
  </text>

  <!-- Faixa do Cargo e Número: 4333 -->
  <g transform="translate(256, 375)" text-anchor="middle">
    <!-- Placa de Voto Dourada 4333 -->
    <rect x="-195" y="-72" width="390" height="124" rx="26" fill="url(#goldGrad)" filter="url(#badgeShadow)"/>
    <rect x="-191" y="-68" width="382" height="116" rx="22" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
    
    <!-- Número 4333 -->
    <text y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="96" font-weight="950" fill="#0f381f" letter-spacing="4">
      4333
    </text>
  </g>

  <!-- Subtítulo inferior: DEPUTADO FEDERAL -->
  <text x="256" y="472" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="3" opacity="0.95">
    DEPUTADO FEDERAL
  </text>
</svg>
