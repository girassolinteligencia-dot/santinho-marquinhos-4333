  <circle cx="392" cy="275" r="7" fill="#194833"/>
  <circle cx="356" cy="305" r="7" fill="#194833"/>
  <rect x="375" y="297" width="26" height="16" rx="4" fill="#10b981"/>

  <!-- Check Neon -->
  <path d="M 180 270 L 255 345 L 395 145" fill="none" stroke="#6ee7b7" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
