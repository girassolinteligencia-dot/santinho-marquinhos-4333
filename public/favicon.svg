<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de fundo verde cívico profundo -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="45%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Gradiente Ouro Oficial 4333 -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Gradiente do badge numérico -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <filter id="favDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#facc15" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle Suave Moderna (Padrão App Store / PWA) -->
  <rect width="512" height="512" rx="120" fill="url(#favBg)"/>

  <!-- Moldura Cívica Suave -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="#facc15" stroke-width="6" stroke-opacity="0.35"/>
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12"/>

  <!-- Faixa Topo: MARQUINHOS TRAD -->
  <g transform="translate(256, 126)" text-anchor="middle">
    <!-- Mini pill de contexto -->
    <rect x="-195" y="-52" width="390" height="52" rx="26" fill="#000000" fill-opacity="0.35" stroke="#4ade80" stroke-width="2"/>
    <text y="-18" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="3.5">
      MARQUINHOS TRAD
    </text>
  </g>

  <!-- Centro Destaque Absoluto: NÚMERO 4333 -->
  <g transform="translate(256, 290)" text-anchor="middle">
    <!-- Placa de Contraste Escura e Borda Ouro -->
    <rect x="-215" y="-105" width="430" height="195" rx="38" fill="url(#pillGrad)" stroke="#facc15" stroke-width="6" filter="url(#favDrop)"/>
    <rect x="-207" y="-97" width="414" height="179" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Número 4333 em Ouro com máxima visibilidade -->
    <text y="48" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="142" font-weight="950" fill="url(#favGold)" letter-spacing="3" filter="url(#goldGlow)">
      4333
    </text>
  </g>

  <!-- Rodapé: DEPUTADO FEDERAL com Estrela Cívica -->
  <g transform="translate(256, 452)" text-anchor="middle">
    <text y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#86efac" letter-spacing="4">
      ★ DEPUTADO FEDERAL ★
    </text>
  </g>
</svg>
